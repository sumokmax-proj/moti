<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@300;400;600&display=swap">
  <style>
    body { margin: 0; }
    a { color: #9C4529; } a:hover { color: #7E3620; }
    .kr { font-family: 'Hahmlet', 'Nanum Myeongjo', serif; }
  </style>
</helmet>

<div class="kr" style="width: 390px; height: 844px; background: #F1EAE0; color: #33302B; display: flex; flex-direction: column; box-sizing: border-box;">

  <div style="display: flex; align-items: center; gap: 4px; padding: 28px 28px 4px; margin-left: -10px;">
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#33302B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </div>
    <div style="font-size: 14px; font-weight: 600; letter-spacing: 0.22em;">즐겨찾기</div>
  </div>

  <div style="display: flex; align-items: baseline; gap: 10px; padding: 18px 28px 0;">
    <div style="width: 36px; height: 2px; background: #B4593A; align-self: center;"></div>
    <p style="margin: 0; font-size: 12px; font-weight: 600; color: #6F604F; letter-spacing: 0.14em;">3편</p>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; padding: 0 28px; overflow: hidden;">

    <div style="display: flex; flex-direction: column; gap: 14px; padding: 26px 0 10px;">
      <p style="margin: 0; font-size: 16px; line-height: 1.75; word-break: keep-all; text-wrap: pretty;">본래 땅 위에 길은 없었다. 걷는 사람이 많아지면 그것이 곧 길이 된다.</p>
      <div style="display: flex; align-items: center; justify-content: space-between; margin: -10px -10px -10px 0;">
        <p style="margin: 0; padding: 10px 0; font-size: 12px; font-weight: 600; color: #6F604F; letter-spacing: 0.12em;">루쉰</p>
        <div style="padding: 12px 10px; font-size: 12px; color: #6F604F; letter-spacing: 0.12em;">삭제</div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 14px; padding: 26px 0 10px; border-top: 1px solid #E0D6C6;">
      <p style="margin: 0; font-size: 16px; line-height: 1.75; word-break: keep-all; text-wrap: pretty;">투쟁이 없으면 진보도 없다.</p>
      <div style="display: flex; align-items: center; justify-content: space-between; margin: -10px -10px -10px 0;">
        <p style="margin: 0; padding: 10px 0; font-size: 12px; font-weight: 600; color: #6F604F; letter-spacing: 0.12em;">프레더릭 더글러스</p>
        <div style="padding: 12px 10px; font-size: 12px; color: #6F604F; letter-spacing: 0.12em;">삭제</div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 14px; padding: 26px 0 10px; border-top: 1px solid #E0D6C6;">
      <p style="margin: 0; font-size: 16px; line-height: 1.75; word-break: keep-all; text-wrap: pretty;">어려워서 감히 못하는 것이 아니라, 감히 하지 않기에 어려워지는 것이다.</p>
      <div style="display: flex; align-items: center; justify-content: space-between; margin: -10px -10px -10px 0;">
        <p style="margin: 0; padding: 10px 0; font-size: 12px; font-weight: 600; color: #6F604F; letter-spacing: 0.12em;">세네카</p>
        <div style="padding: 12px 10px; font-size: 12px; color: #6F604F; letter-spacing: 0.12em;">삭제</div>
      </div>
    </div>

  </div>

</div>
