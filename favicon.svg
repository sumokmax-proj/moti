<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="motimoti">
  <!-- 확정안(시안 E)의 유일한 그래픽 요소인 테라코타 룰에서 나왔다.
       룰 두 개를 어긋나게 놓아, 디자인에서 걷어낸 따옴표를 룰의 언어로 다시 쓴 것이다.

       모서리 rx 8 = 폭의 25%. iOS 아이콘 마스크(약 22%)와 가까워 홈 화면에서 겉돌지 않는다.
       막대 두께 2.8 은 앱 화면의 룰(36x2px)에 맞춘 값이다. 원형 시안에서는 이 두께가
       16px 에서 뭉개져 4 까지 굵혀야 했는데, 모서리를 되찾으면서 되돌릴 수 있었다.

       색은 accent 토큰(#B4593A). 배경을 아이보리로 두면 흰 탭 바에서 아이콘이 사라지므로
       테라코타를 꽉 채우고 마크를 아이보리로 파낸다.

       주의: XML 주석 안에는 붙임표 두 개를 쓸 수 없다. CSS 변수를 그대로 적었다가
       파일 전체가 파싱되지 않았다. 서버는 200 을 주므로 요청 검사로는 안 잡힌다. -->
  <rect width="32" height="32" rx="8" fill="#B4593A"/>
  <rect x="7" y="11" width="18" height="2.8" rx="1.4" fill="#F1EAE0"/>
  <rect x="13" y="18.2" width="12" height="2.8" rx="1.4" fill="#F1EAE0"/>
</svg>
