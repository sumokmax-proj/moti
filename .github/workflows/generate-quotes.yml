name: 📚 Generate Quote Candidates

on:
  # 매주 월요일 오전 9시 (UTC)에 실행
  schedule:
    - cron: '0 9 * * 1'

  # 수동 실행도 가능
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          ref: claude/quote-definition-selection-ha3x53

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 📦 Install dependencies
        run: npm install

      - name: 🤖 Generate quote candidates
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run generate-quotes

      - name: 📝 Create Pull Request
        if: success()
        uses: actions/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'feat: 주간 명언 후보 5개 생성 (자동)'
          title: '📚 Weekly Quote Generation - Review Required'
          body: |
            ## 🎯 주간 명언 후보 검토 필요

            AI가 명언 5개를 자동으로 생성했습니다.

            ### ✅ 다음 단계:
            1. Collector UI에서 각 명언 검토: http://localhost:3000/collector/
            2. "검증 대기" 탭에서 승인/거절 결정
            3. 승인한 명언은 `update-quotes` 스크립트로 자동 반영

            ### 📋 생성된 명언 위치:
            - 파일: `collector/data/pending-quotes.json`
            - 상태: `pending` 배열에 저장됨

            ### 🔍 검증 기준:
            - 1차 출처 확인 가능 (Wikisource, 공식 사이트 등)
            - 의역 없이 원문을 그대로 번역
            - 길이 제약 준수 (한국어 60자 이내)
            - 실제 존재하는 명언

            ---
            _🤖 Generated by Claude Code_
          branch: ${{ github.ref_name }}/weekly-quotes
          delete-branch: true

      - name: ✅ Success notification
        if: success()
        run: |
          echo "✅ 명언 생성 완료!"
          echo "📊 생성된 파일: collector/data/pending-quotes.json"
          echo "🔗 다음 단계: Collector UI에서 검토하세요"

      - name: ❌ Failure notification
        if: failure()
        run: |
          echo "❌ 명언 생성 실패"
          echo "API 키 설정 확인: https://github.com/sumokmax-proj/moti/settings/secrets"
