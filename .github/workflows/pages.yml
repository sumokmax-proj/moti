# GitHub Pages — 본 앱과 스테이징을 한 사이트에 함께 올린다.
#
#   main    → https://motimoti.page/
#   staging → https://motimoti.page/staging/   (실험 기능을 미리 써 보는 곳)
#
# 도메인은 저장소 Settings → Pages → Custom domain 에 넣는다. Actions 로 배포하므로
# CNAME 파일은 필요 없다. 옛 주소 sumokmax-proj.github.io/moti/ 는 새 주소로 넘어간다.
#
# 저장소 Settings → Pages → Build and deployment → Source 가 「GitHub Actions」여야 한다.
# 스테이징 쪽 index.html 에는 검색에 걸리지 않게 noindex 를 넣는다.
# 앱은 주소에 /staging/ 이 있으면 저장 키 앞에 stg- 를 붙인다(app.js) — 즐겨찾기가 섞이지 않는다.

name: Pages

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: main 가져오기
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-src

      - name: staging 이 있는지 보기
        id: stg
        run: |
          if git ls-remote --exit-code --heads "https://github.com/${{ github.repository }}" staging >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: staging 가져오기
        if: steps.stg.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: staging
          path: staging-src

      - name: 사이트 묶기
        run: |
          mkdir _site
          cp -a main-src/. _site/
          rm -rf _site/.git _site/.github _site/node_modules
          if [ -d staging-src ]; then
            mkdir -p _site/staging
            cp -a staging-src/. _site/staging/
            rm -rf _site/staging/.git _site/staging/.github _site/staging/node_modules _site/staging/collector
            sed -i 's|<head>|<head>\n  <meta name="robots" content="noindex, nofollow" />|' _site/staging/index.html
          fi
          touch _site/.nojekyll

      # 명언별 페이지(「펼쳐서 건네기」, /ko/42/ 등)는 저장소에 두지 않고 배포할 때
      # 데이터에서 만든다 — 명언을 더하거나 고치면 페이지도 저절로 따라온다.
      # 그 브랜치에 만드는 도구가 있을 때만 돈다(두 브랜치가 잠시 어긋나도 배포가 깨지지 않게).
      # 명언 카드(링크 미리보기 그림, 명언마다 한 장)는 Playwright 로 그린다. 그린 카드는
      # 캐시에 두고 바뀐 명언만 다시 그린다(파일 이름에 내용의 지문이 있다 — tools/cards.js).
      # 그리기가 실패해도 배포는 계속된다 — 그때 페이지는 공용 그림 og.png 를 쓴다.
      - name: 명언 카드가 필요한지 보기
        id: cards
        run: |
          if [ -f main-src/tools/render-cards.js ] || [ -f staging-src/tools/render-cards.js ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Playwright 캐시
        if: steps.cards.outputs.needed == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.56.1

      - name: 명언 카드 캐시
        if: steps.cards.outputs.needed == 'true'
        uses: actions/cache@v4
        with:
          path: card-cache
          key: cards-${{ github.run_id }}
          restore-keys: cards-

      - name: 명언 카드 그리기
        if: steps.cards.outputs.needed == 'true'
        continue-on-error: true
        run: |
          mkdir -p card-tools card-cache
          (cd card-tools && npm init -y >/dev/null && npm install --no-audit --no-fund playwright@1.56.1 && npx playwright install --with-deps chromium)
          export NODE_PATH="$PWD/card-tools/node_modules"
          for b in main staging; do
            if [ -f "$b-src/tools/render-cards.js" ]; then node "$b-src/tools/render-cards.js" --cache card-cache; fi
          done

      - name: 명언별 페이지 만들기
        run: |
          CARDS=""
          if [ -d card-cache ]; then CARDS="--cards card-cache"; fi
          if [ -f main-src/tools/build-pages.js ]; then
            node main-src/tools/build-pages.js --out _site --site https://motimoti.page/ $CARDS
          fi
          if [ -f staging-src/tools/build-pages.js ]; then
            node staging-src/tools/build-pages.js --out _site/staging --site https://motimoti.page/staging/ --noindex $CARDS
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
