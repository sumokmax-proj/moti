<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>motimoti</title>
  <!-- 파비콘 — 확정안의 룰에서 나온 마크. 원본은 favicon.svg 다.
       svg 를 먼저 두어 지원하는 브라우저는 벡터를 쓰고, png 는 폴백이다.
       apple-touch-icon 만 모서리 없이 꽉 채운다 — iOS 가 자기 마스크를 씌우고
       투명한 모서리는 검게 칠해버린다. -->
  <link rel="icon" href="favicon.svg?v=20261016a" type="image/svg+xml" />
  <link rel="icon" href="favicon-32.png?v=20261016a" sizes="32x32" type="image/png" />
  <link rel="icon" href="favicon-16.png?v=20261016a" sizes="16x16" type="image/png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=20261016a" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@300;400;600&display=swap" />
  <!-- ?v= 는 캐시 무력화용이다. GitHub Pages 는 css/js 를 10분간 캐시하므로
       파일만 바꾸면 돌아온 사람이 옛 파일을 계속 쓴다 — 새 HTML 과 옛 js 가
       섞이면 화면이 조용히 망가진다. 이 파일들을 고칠 때마다 v 를 올린다. -->
  <link rel="stylesheet" href="tokens.css?v=20261016a" />
  <link rel="stylesheet" href="style.css?v=20261016a" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <!-- 로고는 그냥 로고다. 예전에는 수집기로 가는 숨은 입구였다 — 책을 펼치러
           온 사람이 작업실로 들어가지 않게 없앴다(2026-10-15). 수집기는
           collector/ 주소로 직접 연다. -->
      <h1 class="logo">motimoti</h1>
      <div class="header-right">
        <div class="lang-toggle" role="group" aria-label="Language">
          <button class="lang-btn" data-lang="en" type="button" aria-pressed="true">EN</button>
          <span class="lang-sep" aria-hidden="true">·</span>
          <button class="lang-btn" data-lang="ko" type="button" aria-pressed="false">KO</button>
          <span class="lang-sep" aria-hidden="true">·</span>
          <button class="lang-btn" data-lang="vi" type="button" aria-pressed="false">VN<sup class="beta-mark" aria-hidden="true">β</sup></button>
        </div>
        <button id="favorites-nav-btn" class="icon-btn" aria-label="Open favorites">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.5 9.7l5.9-.9L12 3.5Z"/></svg>
        </button>
      </div>
    </header>

    <main id="main-view" class="view">
      <section class="quote-block" id="quote-block">
        <div class="quote-body">
          <div class="rule" aria-hidden="true"></div>
          <p class="quote-text" id="quote-text"></p>
        </div>

        <div class="quote-meta">
          <!-- 작가 이름을 누르면 출처 쪽지가 올라온다(숨은 장치). 겉모습은 글자 그대로다. -->
          <button type="button" class="quote-author" id="quote-author" aria-haspopup="dialog" aria-controls="source-note" aria-expanded="false"></button>
          <div class="quote-actions">
            <button id="favorite-btn" class="icon-btn" aria-label="Add to favorites" aria-pressed="false">
              <svg class="heart-icon" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5s-7.5-4.7-7.5-10A4.5 4.5 0 0 1 12 7.6a4.5 4.5 0 0 1 7.5 2.9c0 5.3-7.5 10-7.5 10Z"/></svg>
            </button>
            <button id="share-btn" class="icon-btn" aria-label="Share">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4"/><path d="m8.5 7.5 3.5-3.5 3.5 3.5"/><path d="M5 13v5.5a1.5 1.5 0 0 0 1.5 1.5h11a1.5 1.5 0 0 0 1.5-1.5V13"/></svg>
            </button>
          </div>
        </div>
      </section>

      <button id="next-btn" class="primary-btn">Next</button>
    </main>

    <section id="favorites-view" class="view hidden">
      <div class="favorites-header">
        <div class="favorites-header-left">
          <button id="back-btn" class="icon-btn" aria-label="Back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
          </button>
          <h2 id="favorites-title">Favorites</h2>
        </div>
        <div class="lang-toggle" role="group" aria-label="Language">
          <button class="lang-btn" data-lang="en" type="button" aria-pressed="true">EN</button>
          <span class="lang-sep" aria-hidden="true">·</span>
          <button class="lang-btn" data-lang="ko" type="button" aria-pressed="false">KO</button>
          <span class="lang-sep" aria-hidden="true">·</span>
          <button class="lang-btn" data-lang="vi" type="button" aria-pressed="false">VN<sup class="beta-mark" aria-hidden="true">β</sup></button>
        </div>
      </div>
      <div class="favorites-count-row" id="favorites-count-row">
        <div class="rule" aria-hidden="true"></div>
        <p class="favorites-count" id="favorites-count"></p>
        <!-- 즐겨찾기를 두 배 자주 펼칠지. 켜짐은 글자 색으로만 보인다 — 언어 버튼과 같은 방식이다. -->
        <button id="weight-btn" class="weight-btn" type="button" aria-pressed="true">Show more often</button>
      </div>
      <ul id="favorites-list" class="favorites-list"></ul>
      <p id="favorites-empty" class="favorites-empty hidden">Nothing saved yet.</p>
      <!-- 책의 맨 뒤 — 판권면을 여는 한 줄. -->
      <button type="button" id="about-btn" class="about-btn" aria-haspopup="dialog" aria-controls="colophon" aria-expanded="false">About this book</button>
    </section>
  </div>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <!-- 출처 쪽지 — 책 사이에 끼워 둔 쪽지처럼 아래에서 올라온다. -->
  <div id="note-veil" class="note-veil" hidden></div>
  <section id="source-note" class="source-note" role="dialog" aria-modal="true" aria-labelledby="note-title" tabindex="-1" hidden>
    <div class="note-grip" aria-hidden="true"></div>
    <p class="note-kind" id="note-kind"></p>
    <p class="note-title" id="note-title"></p>
    <p class="note-orig" id="note-orig"><span class="note-orig-label" id="note-orig-label"></span><span id="note-orig-text"></span></p>
    <p class="note-line" id="note-tr"></p>
    <p class="note-line" id="note-cited"></p>
    <a class="note-link" id="note-link" target="_blank" rel="noopener"><span class="note-link-label" id="note-link-label"></span><span class="note-host" id="note-host"></span></a>
  </section>

  <!-- 판권면 — 출처 쪽지와 같은 종이에, 책의 맨 뒤 한 쪽을 적는다. -->
  <section id="colophon" class="source-note colophon" role="dialog" aria-modal="true" aria-labelledby="colophon-title" tabindex="-1" hidden>
    <div class="note-grip" aria-hidden="true"></div>
    <div class="colophon-head">
      <div class="rule" aria-hidden="true"></div>
      <h2 class="colophon-title" id="colophon-title">motimoti</h2>
      <div class="colophon-motto">
        <p class="colophon-motto-orig" lang="zh-Hant">學而時習之 不亦說乎</p>
        <p class="colophon-motto-tr" id="colophon-motto-tr"></p>
        <p class="colophon-motto-src" id="colophon-motto-src"></p>
      </div>
    </div>
    <div class="colophon-text">
      <p id="colophon-text-1"></p>
      <p id="colophon-text-2"></p>
    </div>
    <dl class="colophon-table" id="colophon-table"></dl>
  </section>

  <script src="quotes.js?v=20261016a"></script>
  <!-- 베트남어(베타). 정식 데이터와 섞지 않으려고 따로 둔다. -->
  <script src="quotes-vi.js?v=20261016a"></script>
  <script src="app.js?v=20261016a"></script>
</body>
</html>
