<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>motimoti</title>
  <!-- 파비콘 — 확정안의 룰에서 나온 마크. 원본은 favicon.svg 다.
       svg 를 먼저 두어 지원하는 브라우저는 벡터를 쓰고, png 는 폴백이다.
       apple-touch-icon 만 모서리 없이 꽉 채운다 — iOS 가 자기 마스크를 씌우고
       투명한 모서리는 검게 칠해버린다. -->
  <link rel="icon" href="favicon.svg?v=20260913a" type="image/svg+xml" />
  <link rel="icon" href="favicon-32.png?v=20260913a" sizes="32x32" type="image/png" />
  <link rel="icon" href="favicon-16.png?v=20260913a" sizes="16x16" type="image/png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=20260913a" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@300;400;600&display=swap" />
  <!-- ?v= 는 캐시 무력화용이다. GitHub Pages 는 css/js 를 10분간 캐시하므로
       파일만 바꾸면 돌아온 사람이 옛 파일을 계속 쓴다 — 새 HTML 과 옛 js 가
       섞이면 화면이 조용히 망가진다. 이 파일들을 고칠 때마다 v 를 올린다. -->
  <link rel="stylesheet" href="tokens.css?v=20260913a" />
  <link rel="stylesheet" href="style.css?v=20260913a" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <!-- 로고가 수집기로 가는 숨은 입구다. 겉모습은 로고 그대로고 링크처럼
           보이지 않는다 (밑줄·색 변화·손가락 커서 없음). 아이콘을 다시 꺼낼
           때는 이 a 를 풀고 header-right 에 톱니 링크를 되살리면 된다. -->
      <h1 class="logo"><a class="logo-link" href="collector/index.html">motimoti</a></h1>
      <div class="header-right">
        <div class="lang-toggle" role="group" aria-label="Language">
          <button class="lang-btn" data-lang="en" type="button" aria-pressed="true">EN</button>
          <span class="lang-sep" aria-hidden="true">·</span>
          <button class="lang-btn" data-lang="ko" type="button" aria-pressed="false">KO</button>
        </div>
        <button id="favorites-nav-btn" class="icon-btn" aria-label="Open favorites">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.5 9.7l5.9-.9L12 3.5Z"/></svg>
        </button>
      </div>
    </header>

    <main id="main-view" class="view">
      <section class="quote-block" id="quote-block">
        <div class="quote-body">
          <div class="rule" aria-hidden="true"></div>
          <p class="quote-text" id="quote-text"></p>
        </div>

        <div class="quote-meta">
          <p class="quote-author" id="quote-author"></p>
          <div class="quote-actions">
            <button id="favorite-btn" class="icon-btn" aria-label="Add to favorites" aria-pressed="false">
              <svg class="heart-icon" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5s-7.5-4.7-7.5-10A4.5 4.5 0 0 1 12 7.6a4.5 4.5 0 0 1 7.5 2.9c0 5.3-7.5 10-7.5 10Z"/></svg>
            </button>
            <button id="share-btn" class="icon-btn" aria-label="Share">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4"/><path d="m8.5 7.5 3.5-3.5 3.5 3.5"/><path d="M5 13v5.5a1.5 1.5 0 0 0 1.5 1.5h11a1.5 1.5 0 0 0 1.5-1.5V13"/></svg>
            </button>
          </div>
        </div>
      </section>

      <button id="next-btn" class="primary-btn">Next</button>
    </main>

    <section id="favorites-view" class="view hidden">
      <div class="favorites-header">
        <div class="favorites-header-left">
          <button id="back-btn" class="icon-btn" aria-label="Back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
          </button>
          <h2 id="favorites-title">Favorites</h2>
        </div>
        <div class="lang-toggle" role="group" aria-label="Language">
          <button class="lang-btn" data-lang="en" type="button" aria-pressed="true">EN</button>
          <span class="lang-sep" aria-hidden="true">·</span>
          <button class="lang-btn" data-lang="ko" type="button" aria-pressed="false">KO</button>
        </div>
      </div>
      <div class="favorites-count-row" id="favorites-count-row">
        <div class="rule" aria-hidden="true"></div>
        <p class="favorites-count" id="favorites-count"></p>
      </div>
      <ul id="favorites-list" class="favorites-list"></ul>
      <p id="favorites-empty" class="favorites-empty hidden">Nothing saved yet.</p>
    </section>
  </div>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script src="quotes.js?v=20260913a"></script>
  <script src="app.js?v=20260913a"></script>
</body>
</html>
